<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:'Inter';src:url('Inter-var.ttf') format('truetype');font-weight:100 900;}
@font-face{font-family:'JBMono';src:url('JetBrainsMono-var.ttf') format('truetype');font-weight:100 800;}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1600px;height:900px;overflow:hidden}
body{background:#081A2E;font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased}
.stage{position:relative;width:1600px;height:900px;overflow:hidden}

.glow-a{position:absolute;width:1150px;height:1150px;right:-380px;top:-430px;border-radius:50%;
  background:radial-gradient(circle,rgba(98,95,237,.40) 0%,rgba(98,95,237,.12) 42%,rgba(98,95,237,0) 68%)}
.glow-b{position:absolute;width:860px;height:860px;left:-330px;bottom:-430px;border-radius:50%;
  background:radial-gradient(circle,rgba(91,247,207,.17) 0%,rgba(93,185,219,.08) 45%,rgba(93,185,219,0) 70%)}
.grid{position:absolute;inset:0;opacity:.05;
  background-image:linear-gradient(rgba(143,163,177,1) 1px,transparent 1px),linear-gradient(90deg,rgba(143,163,177,1) 1px,transparent 1px);
  background-size:64px 64px}
.hairline{position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(135deg,#625FED 0%,#5DB9DB 100%)}

/* isometric layer motif, bottom-left, behind text */
.iso{position:absolute;left:-140px;bottom:-190px;width:520px;height:520px;opacity:.20}
.iso i{position:absolute;left:50%;top:50%;width:320px;height:320px;margin:-160px 0 0 -160px;border-radius:46px;
  border:3px solid #5DB9DB;transform:rotate(45deg) scaleY(.56)}
.iso i:nth-child(1){transform:rotate(45deg) scaleY(.56) translate(-58px,-58px);border-color:#625FED}
.iso i:nth-child(3){transform:rotate(45deg) scaleY(.56) translate(58px,58px);border-color:#5BF7CF}

.content{position:absolute;inset:0;padding:58px 74px 54px 74px;display:flex;flex-direction:column}

.hdr{display:flex;align-items:center;justify-content:space-between}
.lock{display:flex;align-items:center;gap:16px}
.lock img{height:48px;width:auto;display:block}
.wm{font-weight:600;font-size:23px;line-height:1.12;letter-spacing:-.012em;color:#fff}
.beat{font-family:'JBMono',monospace;font-weight:600;font-size:16px;letter-spacing:.19em;color:#5BF7CF;
  border:1px solid rgba(91,247,207,.34);border-radius:999px;padding:9px 21px;background:rgba(91,247,207,.06);text-transform:uppercase;white-space:nowrap}

.body{flex:1;display:flex;align-items:center;gap:60px;padding-top:8px}
.left{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center}
.kicker{font-family:'JBMono',monospace;font-size:15px;letter-spacing:.24em;color:#5DB9DB;text-transform:uppercase;margin-bottom:22px}
h1{font-weight:700;font-size:90px;line-height:1.05;letter-spacing:-.024em;color:#fff;margin-bottom:24px}
h1 .g{background:linear-gradient(105deg,#5BF7CF 0%,#5DB9DB 68%,#7E7BF0 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{font-size:27px;line-height:1.44;color:rgba(255,255,255,.80);max-width:800px}
.pull{margin-top:34px;padding-left:22px;border-left:3px solid #5BF7CF;max-width:800px}
.pull p{font-size:23px;line-height:1.38;color:rgba(255,255,255,.93);font-weight:500;font-style:italic}

.rail{width:342px;flex-shrink:0;display:flex;flex-direction:column;gap:18px}
.stat{position:relative;background:rgba(13,42,72,.62);border:1px solid rgba(93,185,219,.26);border-radius:20px;padding:26px 28px;overflow:hidden}
.stat:before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(180deg,#625FED,#5DB9DB)}
.stat .n{font-family:'JBMono',monospace;font-weight:700;font-size:60px;line-height:1;color:#5BF7CF;letter-spacing:-.03em}
.stat .l{font-size:17px;line-height:1.34;color:rgba(255,255,255,.74);margin-top:11px}
.stat.alt .n{color:#5DB9DB}
.stat.alt:before{background:linear-gradient(180deg,#5DB9DB,#5BF7CF)}

.ftr{display:flex;align-items:flex-end;justify-content:space-between;border-top:1px solid rgba(143,163,177,.20);padding-top:24px}
.src{font-family:'JBMono',monospace;font-size:15px;color:rgba(143,163,177,.95);letter-spacing:.03em}
.src b{color:rgba(255,255,255,.92);font-weight:600}
.site{font-family:'JBMono',monospace;font-size:18px;color:#5DB9DB;letter-spacing:.05em}
</style></head>
<body><div class="stage">
  <div class="glow-a"></div><div class="glow-b"></div><div class="grid"></div>
  <div class="iso"><i></i><i></i><i></i></div>
  <div class="hairline"></div>
  <div class="content">
    <div class="hdr">
      <div class="lock"><img src="mark.svg"><div class="wm">Cascade<br>Clarity</div></div>
      <div class="beat" id="beat"></div>
    </div>
    <div class="body">
      <div class="left">
        <div class="kicker" id="kicker"></div>
        <h1 id="head"></h1>
        <div class="sub" id="sub"></div>
        <div class="pull" id="pullwrap" style="display:none"><p id="pull"></p></div>
      </div>
      <div class="rail" id="rail"></div>
    </div>
    <div class="ftr"><div class="src" id="src"></div><div class="site">cascadeclarity.ai</div></div>
  </div>
</div>
<script>
const D = window.__DATA__;
document.getElementById('beat').textContent   = D.beat;
document.getElementById('kicker').textContent = D.kicker;
document.getElementById('sub').textContent    = D.subhead;
document.getElementById('src').innerHTML      = 'Source: <b>' + D.sourceName + '</b>';
let h = D.headline;
if (D.gradientPhrase && h.includes(D.gradientPhrase)) h = h.replace(D.gradientPhrase, '<span class="g">' + D.gradientPhrase + '</span>');
document.getElementById('head').innerHTML = h;
if (D.pullQuote) { document.getElementById('pullwrap').style.display='block'; document.getElementById('pull').textContent = '“' + D.pullQuote + '”'; }
const rail = document.getElementById('rail');
(D.stats||[]).slice(0,3).forEach((s,i)=>{
  const d=document.createElement('div'); d.className='stat'+(i%2?' alt':'');
  const n=document.createElement('div'); n.className='n'; n.textContent=s.value;
  const l=document.createElement('div'); l.className='l'; l.textContent=s.label;
  d.appendChild(n); d.appendChild(l); rail.appendChild(d);
});
// autofit: shrink headline, then subhead, until the left column fits
const left=document.querySelector('.left'), hd=document.getElementById('head'), sb=document.getElementById('sub');
let fs=90; while(left.scrollHeight>left.clientHeight && fs>42){ fs-=3; hd.style.fontSize=fs+'px'; }
let ss=27; while(left.scrollHeight>left.clientHeight && ss>19){ ss-=1; sb.style.fontSize=ss+'px'; }
</script></body></html>
