<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:'Inter';src:url('Inter-var.ttf') format('truetype');font-weight:100 900;}
@font-face{font-family:'JBMono';src:url('JetBrainsMono-var.ttf') format('truetype');font-weight:100 800;}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1240px;height:1754px;overflow:hidden}
body{background:#FFFFFF;font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased}
.page{position:relative;width:1240px;height:1754px;overflow:hidden;background:#FFFFFF}

.topbar{position:absolute;top:0;left:0;right:0;height:10px;background:linear-gradient(135deg,#625FED 0%,#5DB9DB 100%)}
.wash{position:absolute;right:-260px;top:-260px;width:820px;height:820px;border-radius:50%;
  background:radial-gradient(circle,rgba(98,95,237,.10) 0%,rgba(93,185,219,.05) 45%,rgba(255,255,255,0) 70%)}
.wash2{position:absolute;left:-240px;bottom:-300px;width:720px;height:720px;border-radius:50%;
  background:radial-gradient(circle,rgba(91,247,207,.16) 0%,rgba(93,185,219,.05) 48%,rgba(255,255,255,0) 72%)}
/* isometric layer motif, mint fill only, bottom right */
.iso{position:absolute;right:-90px;bottom:-120px;width:460px;height:460px;opacity:.5}
.iso i{position:absolute;left:50%;top:50%;width:300px;height:300px;margin:-150px 0 0 -150px;border-radius:44px;
  border:3px solid rgba(93,185,219,.30);transform:rotate(45deg) scaleY(.56)}
.iso i:nth-child(1){transform:rotate(45deg) scaleY(.56) translate(-54px,-54px);border-color:rgba(98,95,237,.22)}
.iso i:nth-child(3){transform:rotate(45deg) scaleY(.56) translate(54px,54px);border-color:rgba(91,247,207,.55)}

.content{position:absolute;inset:0;padding:84px 88px 72px 88px;display:flex;flex-direction:column}

/* header */
.hdr{display:flex;align-items:center;justify-content:space-between;padding-bottom:34px;border-bottom:1px solid rgba(11,34,58,.12)}
.lock{display:flex;align-items:center;gap:16px}
.lock img{height:52px;width:auto;display:block}
.wm{font-weight:600;font-size:25px;line-height:1.12;letter-spacing:-.012em;color:#0B223A}
.beat{font-family:'JBMono',monospace;font-weight:600;font-size:15px;letter-spacing:.18em;color:#625FED;
  border:1.5px solid rgba(98,95,237,.34);border-radius:999px;padding:9px 20px;background:rgba(98,95,237,.05);
  text-transform:uppercase;white-space:nowrap}

/* body */
.body{flex:1;display:flex;flex-direction:column;justify-content:flex-start;padding:44px 0 30px 0}
.kicker{font-family:'JBMono',monospace;font-size:16px;letter-spacing:.24em;color:#5DB9DB;text-transform:uppercase;margin-bottom:26px}
h1{font-weight:700;font-size:82px;line-height:1.04;letter-spacing:-.026em;color:#0B223A;margin-bottom:28px}
h1 .g{background:linear-gradient(135deg,#625FED 0%,#5DB9DB 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{font-size:28px;line-height:1.42;color:rgba(11,34,58,.82);font-weight:400}
.secs{margin-top:40px;display:flex;flex-direction:column;flex:1;justify-content:space-evenly;gap:24px}
.sec .lab{font-family:'JBMono',monospace;font-size:15px;letter-spacing:.16em;color:#625FED;font-weight:600;text-transform:uppercase;margin-bottom:10px;display:flex;align-items:baseline;gap:12px}
.sec .lab .num{color:rgba(11,34,58,.28);font-size:15px}
.sec p{font-size:21px;line-height:1.5;color:rgba(11,34,58,.80)}
.cta{margin-top:auto;display:flex;align-items:center;gap:20px;padding:26px 30px;border:1.5px solid rgba(98,95,237,.28);border-radius:16px;background:linear-gradient(135deg,rgba(98,95,237,.045),rgba(93,185,219,.045))}
.cta .dot{width:14px;height:14px;border-radius:50%;background:linear-gradient(135deg,#625FED,#5BF7CF);flex-shrink:0}
.cta p{font-size:22px;line-height:1.4;color:#0B223A;font-weight:500}
.pull{margin-top:22px;padding:28px 32px;background:#F0F4F8;border-left:5px solid #5BF7CF;border-radius:0 14px 14px 0}
.pull p{font-size:26px;line-height:1.38;color:#0B223A;font-weight:500;font-style:italic}
.pull .attr{font-family:'JBMono',monospace;font-style:normal;font-size:15px;color:rgba(11,34,58,.55);margin-top:12px;letter-spacing:.04em}

/* stat row */
.rail{display:flex;gap:18px;margin-top:38px}
.stat{flex:1;position:relative;background:#FFFFFF;border:1.5px solid rgba(11,34,58,.12);border-radius:18px;padding:26px 24px;overflow:hidden}
.stat:before{content:'';position:absolute;left:0;top:0;right:0;height:5px;background:linear-gradient(135deg,#625FED,#5DB9DB)}
.stat.alt:before{background:linear-gradient(135deg,#5DB9DB,#5BF7CF)}
.stat .n{font-family:'JBMono',monospace;font-weight:700;font-size:56px;line-height:1;color:#625FED;letter-spacing:-.035em;margin-top:8px}
.stat.alt .n{color:#0B223A}
.stat .l{font-size:17px;line-height:1.34;color:rgba(11,34,58,.66);margin-top:14px}

/* footer */
.ftr{display:flex;align-items:flex-end;justify-content:space-between;border-top:1px solid rgba(11,34,58,.12);padding-top:28px}
.src{font-family:'JBMono',monospace;font-size:15px;color:rgba(11,34,58,.52);letter-spacing:.02em;max-width:760px;line-height:1.4}
.src b{color:#0B223A;font-weight:600}
.site{font-family:'JBMono',monospace;font-size:19px;color:#625FED;letter-spacing:.05em;white-space:nowrap}
</style></head>
<body><div class="page">
  <div class="wash"></div><div class="wash2"></div>
  <div class="iso"><i></i><i></i><i></i></div>
  <div class="topbar"></div>
  <div class="content">
    <div class="hdr">
      <div class="lock"><img src="mark.svg"><div class="wm">Cascade<br>Clarity</div></div>
      <div class="beat" id="beat"></div>
    </div>
    <div class="body">
      <div class="kicker" id="kicker"></div>
      <h1 id="head"></h1>
      <div class="sub" id="sub"></div>
      <div class="rail" id="rail"></div>
      <div class="secs" id="secs"></div>
      <div class="cta" id="ctawrap" style="display:none"><div class="dot"></div><p id="cta"></p></div>
      <div class="pull" id="pullwrap" style="display:none"><p id="pull"></p><div class="attr">Cascade Clarity</div></div>
    </div>
    <div class="ftr"><div class="src" id="src"></div><div class="site">cascadeclarity.ai</div></div>
  </div>
</div>
<script>
const D = window.__DATA__;
document.getElementById('beat').textContent   = D.beat;
document.getElementById('kicker').textContent = D.kicker;
document.getElementById('sub').textContent    = D.subhead;
document.getElementById('src').innerHTML      = 'Source: <b>' + D.sourceName + '</b>';
let h = D.headline;
if (D.gradientPhrase && h.includes(D.gradientPhrase)) h = h.replace(D.gradientPhrase, '<span class="g">' + D.gradientPhrase + '</span>');
document.getElementById('head').innerHTML = h;
if (D.cta) { document.getElementById('ctawrap').style.display='flex'; document.getElementById('cta').textContent = D.cta; }
if (D.pullQuote) { document.getElementById('pullwrap').style.display='block'; document.getElementById('pull').textContent = '“' + D.pullQuote + '”'; }
const secs = document.getElementById('secs');
(D.sections||[]).slice(0,3).forEach((sec,i)=>{
  const d=document.createElement('div'); d.className='sec';
  const lab=document.createElement('div'); lab.className='lab';
  const num=document.createElement('span'); num.className='num'; num.textContent=String(i+1).padStart(2,'0');
  const t=document.createElement('span'); t.textContent=sec.label;
  lab.appendChild(num); lab.appendChild(t);
  const p=document.createElement('p'); p.textContent=sec.body;
  d.appendChild(lab); d.appendChild(p); secs.appendChild(d);
});
const rail = document.getElementById('rail');
(D.stats||[]).slice(0,3).forEach((s,i)=>{
  const d=document.createElement('div'); d.className='stat'+(i%2?' alt':'');
  const n=document.createElement('div'); n.className='n'; n.textContent=s.value;
  const l=document.createElement('div'); l.className='l'; l.textContent=s.label;
  d.appendChild(n); d.appendChild(l); rail.appendChild(d);
});
// autofit the centre block
const bd=document.querySelector('.body'), hd=document.getElementById('head'), sb=document.getElementById('sub');
let fs=82; while(bd.scrollHeight>bd.clientHeight && fs>46){ fs-=3; hd.style.fontSize=fs+'px'; }
let ss=28; while(bd.scrollHeight>bd.clientHeight && ss>19){ ss-=1; sb.style.fontSize=ss+'px'; }
let ps=21; while(bd.scrollHeight>bd.clientHeight && ps>15){ ps-=1; document.querySelectorAll('.sec p').forEach(e=>e.style.fontSize=ps+'px'); }
</script></body></html>
